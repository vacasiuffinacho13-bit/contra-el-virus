<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-
<meta name="description" content="Contra el Virus: juego interactivo de ciberseguridad para aprender sobre phishing, malware, troyanos y seguridad en WhatsApp.">
scale=1"><title>Contra el Virus</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#dff6ff;color:#17324d}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(720px,100%);min-height:520px;background:white;border-radius:28px;padding:30px;box-shadow:0 12px 35px #0002;text-align:center}.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:460px}.cover h1{font-size:clamp(38px,8vw,68px);margin:12px 0;color:#1769aa}.cover p{font-size:20px}.virus{width:210px;height:210px;margin:5px}.btn{border:0;border-radius:18px;padding:15px 28px;font-size:20px;font-weight:700;background:#1769aa;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0c4d80}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0c4d80}.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:15px}.qnum{font-size:15px;color:#547086}.question{font-size:26px;margin:25px 0}.options{display:grid;gap:13px}.opt{padding:16px;border:3px solid #b9dced;border-radius:16px;background:#f6fcff;font-size:18px;cursor:pointer;text-align:left}.opt:hover{background:#e7f7ff}.feedback{min-height:35px;margin:18px 0;font-weight:700}.next{display:none}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden}.fill{height:100%;background:#37a96b;width:0}.end h2{font-size:38px}.score{font-size:24px;font-weight:700}
</style></head><body><main class="app"><section class="card" id="game"></section></main><script>
const qs=[
['🎣','Recibís un mensaje que dice: “¡Ganaste un premio! Entrá a este enlace y poné tu contraseña”. ¿Qué hacés?',['Entrar rápido antes de que termine','No entrar y avisar a un adulto','Mandárselo a todos tus amigos'],'No entrar y avisar a un adulto'],
['🦠','¿Qué es un malware?',['Un programa que protege la computadora','Un software malicioso que puede causar daños','Un juego de celular'],'Un software malicioso que puede causar daños'],
['🐴','Un archivo parece ser un juego gratis, pero al abrirlo instala algo oculto. ¿Qué podría ser?',['Un troyano','Un antivirus','Una actualización normal'],'Un troyano'],
['🔑','¿Cuál contraseña es más segura?',['12345678','juan2013','R7!mQ2#zL9'],'R7!mQ2#zL9'],
['📱','Alguien te pide el código de 6 números que WhatsApp te envió por SMS. ¿Qué hacés?',['Se lo doy si dice ser un amigo','No lo comparto con nadie','Lo publico para preguntar qué es'],'No lo comparto con nadie'],
['🛡️','¿Para qué sirve la verificación en dos pasos de WhatsApp?',['Para tener más seguridad al iniciar la cuenta','Para hacer los mensajes más rápidos','Para liberar espacio'],'Para tener más seguridad al iniciar la cuenta'],
['📎','Descargaste un archivo de una persona desconocida y tu dispositivo empieza a funcionar raro. ¿Qué conviene hacer?',['Seguir abriendo archivos','Avisar a un adulto y revisar el dispositivo','Compartirlo para comprobar si funciona'],'Avisar a un adulto y revisar el dispositivo'],
['🚨','¿Cuál es una señal típica de phishing?',['Un mensaje urgente que pide datos o contraseñas','Un mensaje de un contacto conocido sin enlaces','Una foto tomada por vos'],'Un mensaje urgente que pide datos o contraseñas'],
['👨‍👩‍👧','Si pensás que tu WhatsApp fue comprometido, ¿qué opción es más segura?',['Pedir ayuda a un adulto de confianza y asegurar la cuenta','Ignorarlo','Dar tus códigos a otra persona'],'Pedir ayuda a un adulto de confianza y asegurar la cuenta'],
['🏆','DESAFÍO FINAL: ¿Cuál regla ayuda más a estar seguro en Internet?',['No compartir contraseñas ni códigos y pensar antes de hacer clic','Abrir todos los enlaces para comprobarlos','Usar la misma contraseña para todo'],'No compartir contraseñas ni códigos y pensar antes de hacer clic']];
let i=0,score=0,answered=false;
const game=document.getElementById('game');
function cover(){game.innerHTML=`<div class="cover"><svg class="virus" viewBox="0 0 220 220" aria-label="Virus caricaturesco"><g stroke="#1769aa" stroke-width="7" stroke-linecap="round">${Array.from({length:12},(_,n)=>{let a=n*Math.PI/6;let x=110+92*Math.cos(a),y=110+92*Math.sin(a),x2=110+108*Math.cos(a),y2=110+108*Math.sin(a);return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}"/>`}).join('')}</g><circle cx="110" cy="110" r="78" fill="#61d6ff" stroke="#1769aa" stroke-width="7"/><circle cx="82" cy="96" r="10" fill="#17324d"/><circle cx="138" cy="96" r="10" fill="#17324d"/><path d="M78 130 Q110 153 142 130" fill="none" stroke="#17324d" stroke-width="7" stroke-linecap="round"/></svg><h1>CONTRA EL VIRUS</h1><p>¿Estás listo para convertirte en un CiberGuardián?</p><button class="btn" onclick="start()">COMENZAR 🚀</button></div>`}
function start(){i=0;score=0;show()}
function show(){answered=false;let q=qs[i];game.innerHTML=`<div class="top"><span>❤️❤️❤️</span><span class="qnum">Pregunta ${i+1} de 10</span></div><div class="bar"><div class="fill" style="width:${i*10}%"></div></div><div style="font-size:60px;margin-top:18px">${q[0]}</div><div class="question">${q[1]}</div><div class="options">${q[2].map((o,n)=>`<button class="opt" onclick="answer(${n})">${String.fromCharCode(65+n)}. ${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="btn next" id="next" onclick="nextQ()">${i===9?'VER RESULTADO':'SIGUIENTE ➜'}</button>`}
function answer(n){if(answered)return;answered=true;let q=qs[i],ok=q[2][n]===q[3];if(ok)score++;document.getElementById('fb').textContent=ok?'✅ ¡Correcto!':'❌ No exactamente. La respuesta segura es: '+q[3];document.getElementById('fb').style.color=ok?'#16834b':'#b54b35';document.getElementById('next').style.display='inline-block';document.querySelectorAll('.opt').forEach(b=>b.disabled=true)}
function nextQ(){if(i<9){i++;show()}else end()}
function end(){let msg=score>=9?'🏆 ¡CiberGuardián experto!':score>=7?'🌟 ¡Muy buen trabajo!':'💪 ¡Buen intento! Volvé a jugar para mejorar.';game.innerHTML=`<div class="end cover"><div style="font-size:85px">🎉🛡️</div><h2>${msg}</h2><p class="score">Puntaje: ${score}/10</p><p>Recordá: no compartas contraseñas ni códigos y pensá antes de abrir enlaces o archivos.</p><button class="btn" onclick="cover()">JUGAR DE NUEVO</button></div>`}
cover();
</script></body></html>
